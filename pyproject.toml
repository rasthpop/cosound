[project]
name = "music-discovery"
version = "0.1.0"
description = "Natural-language music discovery over Discogs metadata and CLAP audio embeddings."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.28.1",
    "huggingface-hub>=2.2.0",
    "numpy>=2.4.6",
    "pandas>=3.0.6",
    "pydantic>=2.7",
    "pydantic-settings>=2.7",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.5",
    "scipy>=1.17.1",
    "soundfile>=0.14.0",
    "sqlalchemy>=2.0",
    "torch>=2.14.1",
    "transformers>=5.20.2",
    "umap-learn>=0.5",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6",
    "ruff>=0.6",
    "mypy>=1.11",
    "import-linter>=2.1",
    "pre-commit>=3.8",
    "pre-commit-hooks>=4.6",
    "detect-secrets>=1.5",
    "pandas-stubs>=3.0.5.260914",
    "types-pyyaml>=6.0.12.20260906",
    "scipy-stubs>=1.17.1.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/music_discovery"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "PT", "C4"]
# Pydantic copies field defaults per instance, so list/dict defaults on models are safe.
ignore = ["RUF012"]

[tool.ruff.lint.per-file-ignores]
# Exception names follow the vocabulary used in the skills and phase plans.
"src/music_discovery/domain/errors.py" = ["N818"]

[tool.ruff.lint.isort]
known-first-party = ["music_discovery"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["music_discovery"]
plugins = ["pydantic.mypy"]
warn_unreachable = true

[[tool.mypy.overrides]]
# soundfile, umap-learn and scikit-learn ship without type information.
module = ["soundfile", "umap", "sklearn", "sklearn.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--import-mode=importlib"]
pythonpath = ["."]
markers = [
    "unit: fast, isolated tests with fakes",
    "integration: multiple real components, local only",
    "api: HTTP-level tests through the FastAPI test client",
    "evaluation: evaluation-pipeline reproducibility tests",
    "slow: real CLAP/UMAP models or large data (run with --run-slow)",
    "live: real external services such as Discogs or OpenRouter (run with --run-live)",
]

[tool.coverage.run]
source = ["music_discovery"]
branch = true

# CPU-only PyTorch (no GPU on the dev machine or CI); avoids the multi-GB CUDA wheels.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
