# Track descriptions and match reasons (descriptions/, grounded-explanations skill).
# Every sentence shown to a user must map to an evidence item; this file holds the knobs.
version: d2-dev-2026-10-26

# Semantic (CLAP) strength bands, from the track's rank and normalized semantic score within
# one query. Raw cosines are never shown. tau_* were chosen on dev-split queries only, see
# docs/calibration.md ("Description strength threshold").
semantic_bands:
  strong_max_rank: 3
  tau_strong: 0.8
  tau_partial: 0.6

# Bands for the normalized metadata (max_scale) and relationship scores, shown in the API as
# `score_bands` and never as numbers. Every metadata match on the dev split scored >= 0.3, so
# partial = "some catalog match" and strong = the best matches; see docs/calibration.md
# ("Score bands"). relationship is off (weight 0, P04.T08), so it has no bands: always null.
score_bands:
  metadata:
    tau_strong: 0.8
    tau_partial: 0.3
  relationship: null

max_sentences: 2
max_reasons: 4

# Words that state more than the evidence can: detection, presence, certainty, probability.
forbidden:
  - contains
  - contain
  - containing
  - features
  - featuring
  - feature
  - detected
  - detect
  - detects
  - includes
  - percent
  - probability
  - probably
  - likely
  - certainly
  - definitely
  - guaranteed
  - proven
  - confirmed
  - perfect

# Instrument nouns may appear only inside a quoted claim (a prompt, tag or title), never as
# a statement about the audio.
instrument_nouns:
  - flute
  - flutes
  - piano
  - pianos
  - guitar
  - guitars
  - drum
  - drums
  - bass
  - bassline
  - violin
  - violins
  - strings
  - cello
  - saxophone
  - sax
  - trumpet
  - horns
  - synth
  - synths
  - synthesizer
  - keyboard
  - organ
  - harp
  - percussion
  - vocals
  - voice
  - singer
  - choir

# Sound descriptors may appear only inside a quoted claim, and never for a track without
# audio evidence.
sound_descriptors:
  - sounds
  - sounding
  - chill
  - calm
  - mellow
  - relaxed
  - relaxing
  - dark
  - bright
  - warm
  - upbeat
  - energetic
  - heavy
  - soft
  - aggressive
  - dreamy
  - melancholic
  - happy
  - sad
  - acoustic
  - atmospheric
  - groovy
  - fast
  - slow
