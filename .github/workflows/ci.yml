name: ci

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install
        run: uv sync --locked
      - name: Check (lint, types, tests, boundaries, import contracts)
        run: make check

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - run: npm run contract:check
      - run: npm run tokens:check
      - run: npx playwright install --with-deps chromium
      - name: End-to-end (mock mode — flows, accessibility, visual baselines)
        run: npm run e2e
      - name: Upload Playwright results (screenshot diffs, traces)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: frontend/test-results/
          retention-days: 7
      - name: Stories (render + axe, both themes)
        run: npm run test-storybook
